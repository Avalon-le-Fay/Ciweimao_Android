name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Check 16 KB page-size compatibility
        continue-on-error: true
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          STATUS=0
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          if [ -z "$ZIPALIGN" ]; then
            echo "::warning::没有找到 zipalign，跳过 APK ZIP 对齐检查"
            STATUS=1
          else
            "$ZIPALIGN" -c -P 16 -v 4 "$APK" || STATUS=1
          fi
          python3 android/check_16kb_alignment.py "$APK" || STATUS=1
          exit "$STATUS"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
