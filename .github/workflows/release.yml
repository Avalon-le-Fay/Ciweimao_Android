name: Build Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build unsigned Release APK
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Decode signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"

          CLEAN_B64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"
          echo "base64 length: ${#CLEAN_B64} chars"

          if ! printf '%s' "$CLEAN_B64" | base64 --decode > "$RUNNER_TEMP/cwm.jks" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64. Re-copy the full single-line value (no commands, prompts, spaces or ellipsis)."
            exit 1
          fi

          chmod 600 "$RUNNER_TEMP/cwm.jks"
          test -s "$RUNNER_TEMP/cwm.jks"
          echo "keystore size: $(wc -c < "$RUNNER_TEMP/cwm.jks") bytes"

      - name: Align and sign Release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          INPUT_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"
          OUTPUT_APK="android/app/build/outputs/apk/release/app-release.apk"

          test -f "$INPUT_APK"

          ZIPALIGN="$(
            find "$ANDROID_HOME/build-tools" \
              -type f -name zipalign \
              | sort -V \
              | tail -n 1
          )"

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          "$ZIPALIGN" -f -P 16 4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/cwm.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$OUTPUT_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" verify --verbose "$OUTPUT_APK"

          ls -lh "$OUTPUT_APK"

      - name: Check 16 KB page-size compatibility
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"
          STATUS=0

          ZIPALIGN="$(
            find "$ANDROID_HOME/build-tools" \
              -type f -name zipalign \
              | sort -V \
              | tail -n 1
          )"

          "$ZIPALIGN" -c -P 16 -v 4 "$APK" || STATUS=1
          python3 android/check_16kb_alignment.py "$APK" || STATUS=1

          exit "$STATUS"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
