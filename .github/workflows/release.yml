name: Build Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Build unsigned Release APKs (arm64-v8a + universal)
        shell: bash
        run: |
          set -euo pipefail
          cd android
          VERSION_NAME="dev"
          VERSION_ARGS=""
          # 版本号从 Git tag 注入：v2.1.3 → versionName=2.1.3、versionCode=20103。
          # 非 v* 触发（workflow_dispatch）时使用 build.gradle 中的默认值。
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            CLEAN_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$CLEAN_VERSION" =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))? ]]; then
              PATCH="${BASH_REMATCH[4]:-0}"
              VERSION_CODE=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + PATCH ))
              VERSION_NAME="$CLEAN_VERSION"
              VERSION_ARGS="-PversionCode=${VERSION_CODE} -PversionName=${CLEAN_VERSION}"
              echo "版本注入: versionCode=${VERSION_CODE}, versionName=${CLEAN_VERSION}"
            else
              echo "::error::无法从 tag '${GITHUB_REF_NAME}' 解析版本号（期望 vX.Y.Z）"
              exit 1
            fi
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          # -PabiSplits=true 打开 build.gradle 里的 ABI 拆分：
          # app-arm64-v8a-release-unsigned.apk / app-universal-release-unsigned.apk
          gradle assembleRelease -PabiSplits=true ${VERSION_ARGS} --stacktrace
          ls -lh app/build/outputs/apk/release/

      - name: Decode signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"

          CLEAN_B64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"
          echo "base64 length: ${#CLEAN_B64} chars"

          if ! printf '%s' "$CLEAN_B64" | base64 --decode > "$RUNNER_TEMP/cwm.jks" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64. Re-copy the full single-line value (no commands, prompts, spaces or ellipsis)."
            exit 1
          fi

          chmod 600 "$RUNNER_TEMP/cwm.jks"
          test -s "$RUNNER_TEMP/cwm.jks"
          echo "keystore size: $(wc -c < "$RUNNER_TEMP/cwm.jks") bytes"

      - name: Align and sign both Release APKs
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          INPUT_DIR="android/app/build/outputs/apk/release"
          # 不写死文件名，兼容 AGP 的命名差异（app-arm64-v8a-release-unsigned.apk 等）。
          ARM64_INPUT="$(find "$INPUT_DIR" -maxdepth 1 -type f -name 'app-arm64-v8a-release*.apk' | head -n 1)"
          UNIVERSAL_INPUT="$(find "$INPUT_DIR" -maxdepth 1 -type f -name 'app-universal-release*.apk' | head -n 1)"
          test -n "$ARM64_INPUT"
          test -n "$UNIVERSAL_INPUT"
          echo "arm64: $ARM64_INPUT"
          echo "universal: $UNIVERSAL_INPUT"

          DIST="$RUNNER_TEMP/dist"
          mkdir -p "$DIST"

          ZIPALIGN="$(
            find "$ANDROID_HOME/build-tools" \
              -type f -name zipalign \
              | sort -V \
              | tail -n 1
          )"
          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f -name apksigner \
              | sort -V \
              | tail -n 1
          )"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          sign_apk() {
            local input="$1"
            local name="$2"
            local aligned="$RUNNER_TEMP/${name}-aligned.apk"
            local output="$DIST/${name}.apk"
            "$ZIPALIGN" -f -P 16 4 "$input" "$aligned"
            "$APKSIGNER" sign \
              --ks "$RUNNER_TEMP/cwm.jks" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$output" \
              "$aligned"
            "$APKSIGNER" verify --verbose "$output"
            ls -lh "$output"
          }

          sign_apk "$ARM64_INPUT" "CwmSync-${VERSION_NAME}-arm64-v8a"
          sign_apk "$UNIVERSAL_INPUT" "CwmSync-${VERSION_NAME}-universal"

          echo "DIST=$DIST" >> "$GITHUB_ENV"

      - name: Verify APK ABIs
        shell: bash
        run: |
          set -euo pipefail
          ARM64="$DIST/CwmSync-${VERSION_NAME}-arm64-v8a.apk"
          UNIVERSAL="$DIST/CwmSync-${VERSION_NAME}-universal.apk"

          echo "== arm64 APK 内的 ABI =="
          unzip -l "$ARM64" | grep -oE 'lib/[^/]+/' | sort -u
          echo "== universal APK 内的 ABI =="
          unzip -l "$UNIVERSAL" | grep -oE 'lib/[^/]+/' | sort -u

          # arm64 分包只允许 arm64
          if unzip -l "$ARM64" | grep -q 'lib/armeabi-v7a/'; then
            echo "::error::arm64 分包里出现了 armeabi-v7a"
            exit 1
          fi
          # universal 必须同时覆盖 32 位和 64 位
          if ! unzip -l "$UNIVERSAL" | grep -q 'lib/arm64-v8a/'; then
            echo "::error::universal 缺少 arm64-v8a"
            exit 1
          fi
          if ! unzip -l "$UNIVERSAL" | grep -q 'lib/armeabi-v7a/'; then
            echo "::error::universal 缺少 armeabi-v7a"
            exit 1
          fi

      - name: Check 16 KB page-size compatibility
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          STATUS=0
          ZIPALIGN="$(
            find "$ANDROID_HOME/build-tools" \
              -type f -name zipalign \
              | sort -V \
              | tail -n 1
          )"
          for APK in "$DIST"/*.apk; do
            echo "== $APK =="
            "$ZIPALIGN" -c -P 16 -v 4 "$APK" || STATUS=1
            python3 android/check_16kb_alignment.py "$APK" || STATUS=1
          done
          exit "$STATUS"

      - name: Upload signed Release APKs
        uses: actions/upload-artifact@v6
        with:
          name: CwmSync-release
          path: ${{ env.DIST }}/*.apk
          if-no-files-found: error
          retention-days: 14
