plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// 版本号默认值（本地构建/调试用）。发布构建由 CI 从 Git tag 注入：
//   gradle assembleRelease -PversionCode=20008 -PversionName=2.0.8
// 见 .github/workflows/release.yml（tag vX.Y.Z → versionCode X*10000+Y*100+Z）。
// 发版时无需再手动修改本文件。
def appVersionCode = 24
def appVersionName = "2.0.7"
def injectedVersionCode = project.findProperty("versionCode")?.toString()?.trim()
def injectedVersionName = project.findProperty("versionName")?.toString()?.trim()
if (injectedVersionCode != null && injectedVersionCode.isInteger()) {
    appVersionCode = injectedVersionCode.toInteger()
}
if (injectedVersionName != null && !injectedVersionName.isEmpty()) {
    appVersionName = injectedVersionName
}

android {
    namespace "com.avalon.cwm"
    compileSdk 35
    ndkVersion "27.1.12297006"

    defaultConfig {
        applicationId "com.avalon.cwm"
        minSdk 25
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        // 366 official transport wrapper is built for the ABIs whose official
        // libcurl/OpenSSL closure is bundled under src/main/jniLibs/.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=none"
            }
        }
        // 构架
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    // AGP 8.5.2 将未压缩 native library 以现代方式打包，支持 16 KB ZIP 对齐。
    packaging {
        jniLibs {
            useLegacyPackaging = false
            keepDebugSymbols += [
                "**/libcurl.so",
                "**/libssl.so",
                "**/libcrypto.so",
            ]
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            assets.srcDirs += ["$buildDir/generated/cwm_assets"]
        }
    }
}


def repoRootDir = file("${rootProject.projectDir}/..")
def generatedAssetsRoot = file("$buildDir/generated/cwm_assets")
def generatedBundleDir = file("$generatedAssetsRoot/cwm_bundle")

tasks.register("prepareCwmBundle", Sync) {
    from(repoRootDir) {
        include "web/**"
        exclude "**/__pycache__/**"
        exclude "**/*.pyc"
    }
    into(generatedBundleDir)
}

tasks.named("preBuild").configure {
    dependsOn("prepareCwmBundle")
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jsoup:jsoup:1.17.2"
    implementation "org.nanohttpd:nanohttpd:2.3.1"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
