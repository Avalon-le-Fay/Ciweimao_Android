plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.avalon.cwm"
    compileSdk 35

    defaultConfig {
        applicationId "com.avalon.cwm"
        minSdk 25
        targetSdk 35
        versionCode 22
        versionName "2.0.5"
        // 构架
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    // AGP 8.5.2 将未压缩 native library 以现代方式打包，支持 16 KB ZIP 对齐。
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    sourceSets {
        main {
            assets.srcDirs += ["$buildDir/generated/cwm_assets"]
        }
    }
}


def repoRootDir = file("${rootProject.projectDir}/..")
def generatedAssetsRoot = file("$buildDir/generated/cwm_assets")
def generatedBundleDir = file("$generatedAssetsRoot/cwm_bundle")

tasks.register("prepareCwmBundle", Sync) {
    from(repoRootDir) {
        include "web/**"
        exclude "**/__pycache__/**"
        exclude "**/*.pyc"
    }
    into(generatedBundleDir)
}

tasks.named("preBuild").configure {
    dependsOn("prepareCwmBundle")
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jsoup:jsoup:1.17.2"
    implementation "org.nanohttpd:nanohttpd:2.3.1"
}
